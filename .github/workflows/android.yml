name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o balance-ball-3d-v1.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2
      - run: cd balance-ball-3d && gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: balance-ball-3d-apk
          path: balance-ball-3d/app/build/outputs/apk/debug/app-debug.apk
